<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA SALON - Control de Puesto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <h4 class="fw-bold">SISTEMA SALON</h4>
            <h6 class="text-muted">Control de Puesto</h6>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center shadow-sm py-2" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login_jefatura' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_admin" class="form-label fw-bold">ID Supervisor</label>
                <input type="number" name="id_admin" id="id_admin" class="form-control text-center fs-5" min="1120" max="1140" required placeholder="1125">
                <div class="form-text text-muted text-center">* Rango autorizado: 1120 a 1140</div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control text-center" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-bold py-2">INGRESAR AL PISO</button>
        </form>
    </div>
</body>
</html>
