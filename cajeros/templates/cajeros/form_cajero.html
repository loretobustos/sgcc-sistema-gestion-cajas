<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} - SGCC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 container" style="max-width: 600px;">
    <h2 class="mb-4">{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-dark fw-bold">Guardar</button>
        <a href="{% url 'listado_cajeros' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
